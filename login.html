<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIAFER y JOAKO — Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <main class="login-screen">

    <!-- Panel izquierdo (decorativo) -->
    <div class="login-panel">
      <div class="login-panel-inner">
        <div class="login-panel-logo">⚽</div>
        <h2 class="login-panel-title">GIAFER y JOAKO</h2>
        <p class="login-panel-sub">Sistema de Ventas del Día</p>
        <ul class="login-panel-features">
          <li>Control de caja en tiempo real</li>
          <li>Registro rápido de ventas</li>
          <li>Gestión de fiados</li>
        </ul>
      </div>
    </div>

    <!-- Panel derecho: formulario -->
    <div class="login-card">

      <div class="login-hero">
        <div class="login-logo-wrap" aria-hidden="true">
          <span class="login-logo">⚽</span>
        </div>
        <h1 class="login-title">Bienvenido</h1>
        <p class="login-subtitle">Ingresá tus datos para continuar</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>

        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username"
            placeholder="Tu usuario" autocomplete="username"
            autocapitalize="none" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password"
            placeholder="Tu contraseña" autocomplete="current-password" required>
        </div>

        <p id="loginError" class="error-msg hidden" role="alert">
          Usuario o contraseña incorrectos. Intentá de nuevo.
        </p>

        <button type="submit" class="btn-login">Ingresar</button>

      </form>

      <p class="login-footer">Desarrollado por Diego Valentino Mayo Samaritano &copy; 2025</p>

    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
