<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiaFer - Bodega</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       Pantalla de Login
       ═══════════════════════════════════════════════════════ -->
  <main class="login-screen">

    <div class="login-card">

      <!-- Logo y título del sistema -->
      <div class="login-hero">
        <!-- Ícono de cabaña/tienda — cambia el emoji aquí si prefieres otro -->
        <div class="login-logo-wrap" aria-hidden="true">
          <span class="login-logo">🛖</span>
        </div>
        <h1 class="login-title">GIAFER y JOAKO</h1>
        <p class="login-subtitle">Sistema de Ventas e Inventario del Dia</p>
      </div>

      <!-- Formulario de autenticación -->
      <form id="loginForm" class="login-form" novalidate>

        <div class="form-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            autocapitalize="none"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <!-- Mensaje de error (oculto por defecto, visible si las credenciales fallan) -->
        <p id="loginError" class="error-msg hidden" role="alert">
          ❌ Usuario o contraseña incorrectos por favor Intenta de nuevo.
        </p>

        <button type="submit" class="btn-login">
          Ingresar al Sistema
        </button>

      </form>

      <p class="login-footer"> Desarrollador  —  Diego Valentino Mayo Samaritano &copy; 2025   </p>

    </div><!-- /login-card -->

  </main>

  <!-- Script único compartido — también maneja login.html -->
  <script src="js/app.js"></script>
</body>
</html>
