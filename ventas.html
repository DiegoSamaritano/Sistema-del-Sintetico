<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIAFER y JOAKO — Ventas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ventas.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">⚽</span>
      <span class="brand-text">GIAFER y JOAKO</span>
    </div>
    <button id="navToggle" class="nav-toggle" aria-label="Menú" aria-expanded="false" aria-controls="navbarMenu">
      <span></span><span></span><span></span>
    </button>
    <div id="navbarMenu" class="navbar-menu">
      <a href="index.html"  class="nav-link">Caja</a>
      <a href="ventas.html" class="nav-link active">Ventas</a>
      <a href="deudas.html" class="nav-link">Fiados</a>
      <button id="logoutBtn" class="btn-logout">Salir</button>
    </div>
  </nav>

  <main class="main-content">

    <div class="page-header">
      <h1 class="page-title">Nueva Venta</h1>
    </div>

    <div class="card">
      <form id="ventasForm" novalidate>

        <!-- CERVEZAS -->
        <div class="cerv-selector">
          <p class="cerv-selector-label">🍺 Cervezas</p>
          <div class="brand-row">
            <button type="button" class="brand-btn" id="bb-Cusqueña" onclick="selectCerveza('Cusqueña')">
              <span class="brand-btn-icon">🍺</span>
              <span class="brand-btn-name">Cusqueña</span>
            </button>
            <button type="button" class="brand-btn" id="bb-Pilsen" onclick="selectCerveza('Pilsen')">
              <span class="brand-btn-icon">🍺</span>
              <span class="brand-btn-name">Pilsen</span>
            </button>
            <button type="button" class="brand-btn" id="bb-Cristal" onclick="selectCerveza('Cristal')">
              <span class="brand-btn-icon">🍺</span>
              <span class="brand-btn-name">Cristal</span>
            </button>
          </div>
        </div>

        <!-- CALCULADORA (aparece al seleccionar marca) -->
        <div id="cerv-calc" class="cerv-calc hidden">
          <div class="cerv-calc-head">
            <span class="cerv-calc-brand-tag">🍺 <span id="cerv-calc-brand"></span></span>
            <button type="button" class="cerv-change-btn" onclick="clearCerveza()">✕ Cambiar</button>
          </div>
          <div class="cerv-calc-body">
            <div class="cerv-input-col">
              <label>Cantidad</label>
              <input type="number" id="cervQty" min="1" value="1" oninput="calcCerveza()">
            </div>
            <span class="cerv-sym">×</span>
            <div class="cerv-input-col">
              <label>Precio c/u</label>
              <div class="cerv-prefix-wrap">
                <span>S/</span>
                <input type="number" id="cervPrice" min="0" step="0.5" placeholder="0.00" oninput="calcCerveza()">
              </div>
            </div>
            <span class="cerv-sym">=</span>
            <div class="cerv-total-col">
              <label>Total</label>
              <strong id="cerv-total-val">S/ 0.00</strong>
            </div>
          </div>
        </div>

        <!-- DIVIDER -->
        <div id="manualDivider" class="divider"><span>o ingresá manualmente</span></div>

        <!-- DESCRIPCIÓN + MONTO (modo manual) -->
        <div id="manualBlock">
          <div class="field-block">
            <label class="field-label" for="saleDescription">Descripción</label>
            <input type="text" id="saleDescription" name="saleDescription"
              class="field-input" placeholder="Ej: Alquiler cancha — Juan" autocomplete="off">
          </div>
          <div class="field-block" style="margin-top:1.1rem">
            <label class="field-label" for="saleAmount">Monto</label>
            <div class="amount-wrap">
              <span class="amount-prefix">S/</span>
              <input type="number" id="saleAmount" name="saleAmount"
                class="field-input" placeholder="0.00" min="0.01" step="0.01">
            </div>
          </div>
        </div>

        <!-- inputs ocultos para modo cerveza -->
        <input type="hidden" id="saleDescHidden">

        <div class="separator"></div>

        <!-- MÉTODO DE PAGO -->
        <div class="field-block">
          <label class="field-label">Método de pago</label>
          <div class="payment-grid">

            <label class="pay-option" for="pm-efectivo">
              <input type="radio" id="pm-efectivo" name="paymentMethod" value="efectivo">
              <div class="pay-inner">
                <img src="img/sol.png" alt="Efectivo">
                <span>Efectivo</span>
              </div>
            </label>

            <label class="pay-option" for="pm-yape">
              <input type="radio" id="pm-yape" name="paymentMethod" value="yape">
              <div class="pay-inner">
                <img src="img/yape.png" alt="Yape">
                <span>Yape</span>
              </div>
            </label>

            <label class="pay-option" for="pm-plin">
              <input type="radio" id="pm-plin" name="paymentMethod" value="plin">
              <div class="pay-inner">
                <img src="img/plin.png" alt="Plin">
                <span>Plin</span>
              </div>
            </label>

            <label class="pay-option pay-option--fiado" for="pm-fiado">
              <input type="radio" id="pm-fiado" name="paymentMethod" value="fiado">
              <div class="pay-inner">
                <img src="img/deuda.png" alt="Fiado">
                <span>Fiado</span>
              </div>
            </label>

          </div>
        </div>

        <!-- DEUDOR (solo fiado) -->
        <div id="debtorGroup" class="field-block hidden">
          <label class="field-label" for="debtorSelect">
            Deudor <span class="req">* obligatorio</span>
          </label>
          <select id="debtorSelect" name="debtorSelect" class="field-input">
            <option value="">— Seleccioná un deudor —</option>
          </select>
          <p class="hint">¿No aparece? <a href="deudas.html">Agregalo en Fiados →</a></p>
        </div>

        <button type="submit" class="btn-registrar">Registrar venta</button>

      </form>
    </div>

    <!-- HISTORIAL -->
    <div class="card card--history">
      <h3 class="history-title">Ventas recientes</h3>
      <div id="recentSalesContainer" class="sales-list">
        <p class="empty-msg">Todavía no hay ventas registradas.</p>
      </div>
    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
